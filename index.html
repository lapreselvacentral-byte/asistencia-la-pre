
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asistencia QR - La Pre</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      margin: 0;
      padding: 20px;
      color: #1e293b;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 22px;
      background: white;
      border-radius: 14px;
      text-align: center;
    }

    h1 { color: #174b82; }

    select, input, button {
      width: 100%;
      padding: 14px;
      margin-top: 14px;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }

    select, input {
      border: 1px solid #cbd5e1;
      background: white;
    }

    button {
      border: none;
      background: #174b82;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    #lector { margin-top: 20px; }

    #estado {
      margin-top: 18px;
      padding: 13px;
      background: #e2e8f0;
      border-radius: 8px;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>LA PRE</h1>
    <strong>CONTROL DE ASISTENCIA QR</strong>
    <p>Registro de ingreso y salida del personal</p>

    <select id="sede">
      <option value="">Seleccionar sede</option>
      <option value="SED001">La Merced</option>
      <option value="SED002">San Ramón</option>
      <option value="SED003">Oxapampa</option>
    </select>

    <input
      type="password"
      id="pin"
      placeholder="PIN del encargado"
      inputmode="numeric"
      autocomplete="off"
    >

    <button id="iniciar" onclick="iniciarEscaner()">
      ACTIVAR CÁMARA
    </button>

    <button onclick="detenerEscaner()">
      DETENER CÁMARA
    </button>

   <div id="lector" style="width:100%; min-height:300px; margin-top:20px;"></div>
    <div id="estado">Selecciona tu sede e ingresa el PIN.</div>
  </div>

  <script>
    const WORKER_URL =
      'https://asistencia-la-pre-api.lapreselvacentral.workers.dev/';

    let escaner = null;
    let procesando = false;

    async function iniciarEscaner() {
      const sede = document.getElementById('sede').value;
      const pin = document.getElementById('pin').value.trim();
      const estado = document.getElementById('estado');
      const iniciar = document.getElementById('iniciar');

      if (!sede) {
        estado.textContent = 'Primero selecciona una sede.';
        return;
      }

      if (!pin) {
        estado.textContent = 'Ingresa el PIN del encargado.';
        return;
      }

      try {
        if (escaner) {
          if (escaner.isScanning) await escaner.stop();
          await escaner.clear();
        }

        escaner = new Html5Qrcode('lector');

        iniciar.disabled = true;
        estado.textContent = 'Solicitando acceso a la cámara...';

        await escaner.start(
          { facingMode: 'environment' },
          { fps: 10, qrbox: { width: 250, height: 250 } },
          codigo => procesarQR(codigo)
        );

        estado.textContent = 'Cámara activada. Escanea un QR.';

      } catch (error) {
        iniciar.disabled = false;
        estado.textContent = 'Error al abrir la cámara: ' + error;
      }
    }

    async function procesarQR(codigo) {
      if (procesando) return;

      procesando = true;

      const estado = document.getElementById('estado');
      const sede = document.getElementById('sede').value;
      const pin = document.getElementById('pin').value.trim();

      try {
        if (escaner && escaner.isScanning) {
          escaner.pause(true);
        }

        estado.textContent = 'QR detectado. Registrando asistencia...';

        const respuesta = await fetch(WORKER_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            codigo: codigo,
            idSede: sede,
            pin: pin
          })
        });

        const textoRespuesta = await respuesta.text();
console.log('Respuesta del servidor:', textoRespuesta);

let datos;
try {
  datos = JSON.parse(textoRespuesta);
} catch (error) {
  throw new Error('El servidor no devolvió JSON. Respuesta: ' + textoRespuesta);
}

        if (!respuesta.ok || !datos.correcto) {
          throw new Error(datos.mensaje || 'No se pudo registrar la asistencia.');
        }

        estado.textContent = '✅ ' + datos.mensaje;

      } catch (error) {
        estado.textContent = '❌ ' + error.message;

      } finally {
        setTimeout(() => {
          procesando = false;

          if (escaner && escaner.isScanning) {
            escaner.resume();
          }
        }, 2500);
      }
    }

    async function detenerEscaner() {
      if (escaner) {
        try {
          if (escaner.isScanning) await escaner.stop();
          await escaner.clear();
        } catch (error) {}
      }

      escaner = null;
      procesando = false;

      document.getElementById('iniciar').disabled = false;
      document.getElementById('estado').textContent = 'Cámara detenida.';
    }
  </script>
</body>
</html>
